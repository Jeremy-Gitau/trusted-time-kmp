name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-jvm:
    name: Android and JVM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Lint, test and build samples
        run: >-
          ./gradlew ktlintCheck
          :trusted-time:jvmTest
          :trusted-time:testAndroidHostTest
          :sample-app:assembleDebug
          :sample-jvm:assemble

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Test on the iOS simulator
        run: ./gradlew :trusted-time:iosSimulatorArm64Test
      - name: Build the iOS sample
        run: >-
          xcodebuild build
          -project sample-ios/SampleIos.xcodeproj
          -scheme SampleIos
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO

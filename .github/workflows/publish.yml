name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Check the release tag matches the library version
        run: |
          version=$(grep -oE 'version = "[^"]+"' trusted-time/build.gradle.kts | cut -d'"' -f2)
          if [ "${{ github.event.release.tag_name }}" != "v$version" ]; then
            echo "Release tag ${{ github.event.release.tag_name }} doesn't match version $version (expected v$version)"
            exit 1
          fi
      - name: Test
        run: ./gradlew :trusted-time:jvmTest :trusted-time:testAndroidHostTest :trusted-time:iosSimulatorArm64Test :trusted-time:wasmJsNodeTest
      - name: Publish
        run: ./gradlew :trusted-time:publishAndReleaseToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

name: Device test report
description: Report how trusted time behaves on a real device
title: "Device test: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! This checks that the trusted time keeps counting correctly while the device sleeps.

        **iOS steps**
        1. Open `sample-ios/SampleIos.xcodeproj` in Xcode, pick your Team under Signing & Capabilities, and run it on your iPhone. If Xcode says the bundle identifier is unavailable, change it to something unique, like `com.yourname.trustedtime`.
        2. Tap **Sync**, then **Get Time**. Note the "System clock is off by … ms" value.
        3. Lock the phone and leave it for at least 10 minutes.
        4. Unlock, tap **Get Time** again (don't sync), and note the value.

        The two values should be within about a second of each other.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS
        - Android
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS version
      placeholder: iPhone 15, iOS 26.1
    validations:
      required: true
  - type: dropdown
    id: sync
    attributes:
      label: Sync result
      options:
        - Synced, source TRUSTED
        - Sync failed
    validations:
      required: true
  - type: input
    id: before
    attributes:
      label: Offset before sleep (ms)
      placeholder: "-412"
    validations:
      required: true
  - type: input
    id: sleep
    attributes:
      label: How long the device was locked
      placeholder: 15 minutes
    validations:
      required: true
  - type: input
    id: after
    attributes:
      label: Offset after sleep (ms)
      placeholder: "-398"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes or screenshots
      description: Anything unexpected, Xcode console output, or screenshots of the sample app.

[versions]
kotlin = "2.4.21"
androidGradlePlugin = "9.4.1"
androidMinSdk = "21"
androidCompileSdk = "36"
androidTargetSdk = "36"
kotlinxDatetime = "0.8.0"
kotlinxCoroutines = "1.11.0"
playServicesTime = "16.0.1"
apacheCommonsNet = "3.13.0"
vanniktechPublish = "0.29.0"
ktlintGradle = "14.2.0"
appcompat = "1.8.0"
lifecycle = "2.11.0"

[libraries]
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }

# Android
play-services-time = { group = "com.google.android.gms", name = "play-services-time", version.ref = "playServicesTime" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }

# JVM
apache-commons-net = { group = "commons-net", name = "commons-net", version.ref = "apacheCommonsNet" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidGradlePlugin" }
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
vanniktech-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktechPublish" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }

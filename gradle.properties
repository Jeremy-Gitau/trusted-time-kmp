# Gradle performance
org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC
org.gradle.caching=true
org.gradle.configuration-cache=true

# KMP
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.androidSourceSetLayoutVersion=2

# Android
android.useAndroidX=true

# ─── Maven Central Publishing ────────────────────────────────────────────────
# Add these to your LOCAL ~/.gradle/gradle.properties (never commit secrets!)
#
# mavenCentralUsername=your_sonatype_username
# mavenCentralPassword=your_sonatype_password
#
# For signing:
# signing.keyId=LAST_8_CHARS_OF_KEY_ID
# signing.password=your_key_passphrase
# signing.secretKeyRingFile=/path/to/your/secring.gpg
